[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunat-mcp"
version = "0.1.0"
description = "Servidor MCP para validar y consultar RUCs peruanos sobre el Padron Reducido oficial de SUNAT, sin salir de tu maquina."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Nochi", email = "arturonochi@gmail.com" }]
keywords = ["mcp", "sunat", "ruc", "peru", "padron-reducido"]

dependencies = [
    "mcp>=1.2",
]

[project.optional-dependencies]
ingest = [
    "httpx>=0.27",
]
dev = [
    "pytest",
    "httpx>=0.27",
]

[project.scripts]
sunat-mcp = "sunat_mcp.server:main"

[tool.setuptools.packages.find]
include = ["sunat_mcp*"]

[tool.pytest.ini_options]
markers = [
    "slow: pruebas que tardan varios segundos (p. ej. construir un indice grande).",
]
