[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Nombre de DISTRIBUCION (lo que se instala con pip). El modulo que se importa
# sigue siendo `sunat_mcp`, igual que pillow instala PIL. El repositorio
# tambien conserva el nombre sunat-mcp.
name = "peru-ruc-mcp"
version = "0.1.0"
description = "Servidor MCP para validar y consultar RUCs peruanos sobre el Padron Reducido oficial de SUNAT, sin salir de tu maquina."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Nochi", email = "arturonochi@gmail.com" }]
keywords = ["mcp", "sunat", "ruc", "peru", "padron-reducido", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/r2nochi/sunat-mcp"
Repository = "https://github.com/r2nochi/sunat-mcp"
Issues = "https://github.com/r2nochi/sunat-mcp/issues"

[project.optional-dependencies]
ingest = [
    "httpx>=0.27",
]
dev = [
    "pytest",
    "httpx>=0.27",
]

[project.scripts]
# El ejecutable lleva el mismo nombre que la distribucion para que
# `uvx peru-ruc-mcp` funcione sin argumentos extra.
peru-ruc-mcp = "sunat_mcp.server:main"

[tool.setuptools.packages.find]
include = ["sunat_mcp*"]

[tool.pytest.ini_options]
markers = [
    "slow: pruebas que tardan varios segundos (p. ej. construir un indice grande).",
]
